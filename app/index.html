<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Workshop Registration</h1>

        <form id="regForm">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name">

            <label for="email">Email</label>
            <input type="text" id="email" name="email">

            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone">

            <label for="workshop_id">Workshop</label>
            <select id="workshop_id" name="workshop_id">
                <option value="1">Intro to Web Security</option>
                <option value="2">Advanced PHP</option>
                <option value="3">MySQL Performance</option>
            </select>

            <label for="seats">Number of seats</label>
            <input type="number" id="seats" name="seats" value="1">

            <button type="submit">Register</button>
        </form>

        <p id="message"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
